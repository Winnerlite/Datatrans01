name: libsc

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build JAR
        run: mvn -B -q clean package
        
      - name: Run
        env:
          WORKER_API_KEY:    ${{ secrets.WORKER_API_KEY }}
          WORKER_ORIGIN:     ${{ secrets.WORKER_ORIGIN }}
        run: mvn exec:java -Dexec.mainClass="com.libapp.apk.LibmotScraper"
