name: BenueLinks Daily Scrape

on:
  schedule:
    # 05:00 UTC daily = 06:00 WAT (Nigeria time)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Days ahead to scrape'
        required: false
        default: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR
        run: mvn -B -q clean package

      - name: Run scraper
        env:
          WORKER_API_KEY:    ${{ secrets.WORKER_API_KEY }}
          WORKER_ORIGIN:     ${{ secrets.WORKER_ORIGIN }}
          SCRAPE_DAYS_AHEAD: ${{ inputs.days_ahead || '1' }}
        run: java -jar target/benuelinks-scraper-1.0.jar
