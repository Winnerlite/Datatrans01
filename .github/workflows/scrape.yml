name: BenueLinks Daily Scrape

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR
        run: mvn -B -q clean package

      - name: Run scraper
        env:
          WORKER_API_KEY:    ${{ secrets.WORKER_API_KEY }}
          WORKER_ORIGIN:     ${{ secrets.WORKER_ORIGIN }}
        run: java -jar target/benuelinks-scraper-1.0.jar
