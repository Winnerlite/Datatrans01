name: prsc

on:
  schedule:
    # Every 6 hours (Plateau Riders has many destinations, so we don't want to hammer them)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Increased timeout because scraping 20+ destinations takes time

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B -q clean package

      - name: Install Playwright Browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run Scraper
        env:
          WORKER_API_KEY:    ${{ secrets.WORKER_API_KEY }}
          WORKER_ORIGIN:     ${{ secrets.WORKER_ORIGIN }}
        run: mvn exec:java -Dexec.mainClass="com.plateauriders.apk.PlateauScraper"
