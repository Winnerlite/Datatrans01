name: prsc

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120 

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B -q clean package

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libnss3 libgbm1 libgtk-3-0

      - name: Install Playwright Browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run Scraper
        env:
          WORKER_API_KEY:    ${{ secrets.WORKER_API_KEY }}
          WORKER_ORIGIN:     ${{ secrets.WORKER_ORIGIN }}
        run: |
          # 1. Save all dependencies to a file
          mvn dependency:build-classpath -Dmdep.outputFile=cp.txt -q
          # 2. Run the class directly from target/classes
          java -cp "target/classes:$(cat cp.txt)" com.plateauriders.apk.PlateauScraper
